<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shore Book">
<meta name="theme-color" content="#EDEAE1">
<title>Shore Book · Hong Kong to Singapore</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --stone:#EDEAE1;
  --sand:#FBFAF6;
  --ink:#131E28;
  --sea:#1D5A6E;
  --sea-tint:#DDE7E9;
  --rosso:#8C2F39;
  --reel:#8A6B1F;
  --olio:#4F6B2F;
  --rule:#C9C6BB;
  --mute:#6E7378;
  --display:"Didot","Bodoni 72",Didot LT STD,"Hoefler Text",Georgia,serif;
  --body:"Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Menlo","SF Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stone);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:620px;margin:0 auto;padding:0 18px 72px}

/* ---------- brand strip ---------- */
.brand{
  display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;
  padding:14px 0 12px;border-bottom:1px solid var(--rule);
}
.brand img{width:38px;height:38px;display:block;flex:0 0 auto}
.brand-name{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);line-height:1.35;
}
.brand-name b{display:block;font-weight:400;color:var(--ink)}

/* ---------- masthead ---------- */
header{padding:18px 0 0}
.kicker{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);display:flex;justify-content:space-between;align-items:baseline;
}
h1{
  font-family:var(--display);font-weight:400;font-size:44px;line-height:.95;
  margin:8px 0 2px;letter-spacing:-.01em;
}
.sub{font-size:13px;color:var(--mute);margin:0 0 14px}

/* ---------- port rail ---------- */
.ports{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;margin:0 -18px;
  padding-left:18px;padding-right:18px;scrollbar-width:none}
.ports::-webkit-scrollbar{display:none}
.port-btn{
  flex:0 0 auto;background:transparent;border:1px solid var(--rule);
  border-radius:2px;padding:7px 12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--mute);cursor:pointer;
}
.port-btn[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--stone)}
.port-btn:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

/* ---------- tide bar (signature) ---------- */
.tide{border:1px solid var(--ink);background:var(--sand);padding:12px 13px 11px;margin:2px 0 18px}
.tide-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tide-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tide-clock{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tide-clock.warn{color:var(--rosso)}
.tide-track{
  position:relative;height:16px;margin:10px 0 8px;border:1px solid var(--rule);
  background:repeating-linear-gradient(-45deg,transparent 0 4px,var(--rule) 4px 5px);
}
.tide-fill{position:absolute;inset:0 auto 0 0;background:var(--sea-tint);
  border-right:2px solid var(--sea);transition:width .6s ease}
@media (prefers-reduced-motion:reduce){.tide-fill{transition:none}}
.tide-foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute)}
.tide-foot input{
  font-family:var(--mono);font-size:12px;border:0;border-bottom:1px solid var(--rule);
  background:transparent;color:var(--ink);padding:1px 0;
}
.tide-foot input:focus{outline:none;border-bottom-color:var(--sea)}

/* ---------- dock strip ---------- */
.dock{border-left:3px solid var(--sea);padding:2px 0 2px 12px;margin:0 0 20px;font-size:14px}
.dock b{font-weight:600}
.dock span{display:block;color:var(--mute);font-size:13px;margin-top:2px}

/* ---------- tabs ---------- */
.tabs{display:flex;border-bottom:1px solid var(--rule);margin:0 0 18px}
.tab{
  flex:1 1 0;min-width:0;background:none;border:0;border-bottom:2px solid transparent;
  margin-bottom:-1px;padding:9px 1px;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rosso)}
.tab:focus-visible{outline:2px solid var(--sea);outline-offset:-2px}

/* ---------- sounding rail (stops) ---------- */
.rail{position:relative;margin:0;padding:0 0 0 34px;list-style:none}
.rail::before{content:"";position:absolute;left:9px;top:10px;bottom:26px;
  width:1px;background:var(--rule)}
.stop{position:relative;padding:0 0 20px}
.dot{
  position:absolute;left:-34px;top:2px;width:19px;height:19px;border-radius:50%;
  border:1px solid var(--ink);background:var(--stone);color:var(--ink);
  font-family:var(--mono);font-size:10px;line-height:17px;text-align:center;
  cursor:pointer;padding:0;
}
.stop.done .dot{background:var(--ink);color:var(--stone)}
.stop.done .stop-name{text-decoration:line-through;color:var(--mute)}
.dot:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.stop-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  cursor:pointer}
.stop-name{font-family:var(--display);font-size:21px;line-height:1.15}
.stop-dur{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap}
.stop-body{display:none;padding:6px 0 0}
.stop.open .stop-body{display:block}
.stop-body p{margin:0 0 8px;font-size:14.5px}
.look{border-left:2px solid var(--rosso);padding-left:10px;font-size:13.5px;color:var(--ink)}
.look b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rosso);display:block;margin-bottom:2px;font-weight:400}
.leg{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mute);margin-top:10px}

/* ---------- food tour (a rail, but nothing to tick off) ---------- */
.dot.static{cursor:default;line-height:17px}
.stop.taste .dot{border-color:var(--olio);color:var(--olio)}
.stop-where{display:block;font-family:var(--body);font-size:12.5px;line-height:1.35;
  color:var(--mute);margin-top:3px}
.stop-dur em{display:block;font-style:normal;font-size:10px;text-align:right;margin-top:3px}
.look.ord{border-left-color:var(--olio)}
.look.ord b{color:var(--olio)}

/* ---------- the shopping circuit (same rail, sea ink) ---------- */
.circ{border-top:1px solid var(--rule);margin-top:24px;padding-top:14px}
.circ h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);font-weight:400;margin:0 0 10px}
.stop.buy .dot{border-color:var(--sea);color:var(--sea)}
.look.shop{border-left-color:var(--sea)}
.look.shop b{color:var(--sea)}
.brk{margin-top:12px;border-left:2px solid var(--rosso);padding:2px 0 2px 10px;
  font-size:13px;color:var(--ink)}
.geo{display:inline-block;margin-top:9px;font-family:var(--mono);font-size:11px;
  color:var(--sea);text-decoration:none;border-bottom:1px solid var(--sea-tint)}
.geo+.geo{margin-left:14px}
.geo.btn{border:0;border-bottom:1px solid var(--sea-tint);background:none;padding:0;cursor:pointer}

/* ---------- the drink (foot of the food tour) ---------- */
.sips{border-top:1px solid var(--rule);margin-top:24px;padding-top:14px}
.sips h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);font-weight:400;margin:0 0 6px}
.sip{border:1px solid var(--rule);background:var(--sand);padding:11px 12px;margin:0 0 10px}
.sip-kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--olio);display:block}
.sip-kind.lt{color:var(--sea)}
.sip-name{font-family:var(--display);font-size:21px;line-height:1.15;display:block;margin-top:2px}
.sip-where{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--mute);margin-top:5px}
.sip-where em{font-style:normal;white-space:nowrap}
.sip p{margin:8px 0 0;font-size:14px}
.sip .note{color:var(--mute);font-size:13px}
.sip .look{margin-top:9px}
.look.lt{border-left-color:var(--sea)}
.look.lt b{color:var(--sea)}

/* ---------- projection ---------- */
.proj{border:1px dashed var(--rule);background:var(--sand);padding:11px 13px;margin:0 0 20px;
  font-size:13.5px}
.proj b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);display:block;margin-bottom:3px;font-weight:400}
.proj.tight{border-color:var(--rosso);border-style:solid}
.proj.tight strong{color:var(--rosso)}

/* ---------- lists ---------- */
.entry{border-top:1px solid var(--rule);padding:12px 0}
.entry:first-child{border-top:0}
.entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.entry-name{font-family:var(--display);font-size:19px}
.entry-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--sea);white-space:nowrap;border:1px solid var(--sea-tint);padding:2px 5px}
.entry p{margin:5px 0 0;font-size:14px;color:var(--ink)}
.know li{font-size:14.5px;margin-bottom:9px}
.know{padding-left:18px}

/* ---------- glyphs (shared by chart and cards) ---------- */
.gly{
  display:inline-flex;align-items:center;justify-content:center;
  width:21px;height:21px;flex:0 0 21px;margin-top:1px;
  font-family:var(--mono);font-size:10px;color:var(--sand);background:var(--ink);
}
.gly i{font-style:normal;display:block}
.gly.k-walk{border-radius:50%}
.gly.k-eat{background:var(--rosso)}
.gly.k-buy{background:var(--sea);transform:rotate(45deg)}
.gly.k-buy i{transform:rotate(-45deg)}
.gly.k-screen{background:var(--reel);border-radius:50%;
  box-shadow:inset 0 0 0 1px var(--reel), inset 0 0 0 2.4px var(--sand)}
.gly.k-taste{background:var(--olio);clip-path:polygon(50% 0,100% 100%,0 100%)}
.gly.k-taste i{margin-top:6px;font-size:9px}

/* ---------- cards ---------- */
.card{border:1px solid var(--rule);background:var(--sand);padding:11px 12px;margin:0 0 10px}
.card.hi{border-color:var(--ink);box-shadow:2px 2px 0 var(--rule)}
.card-head{display:flex;gap:10px;align-items:flex-start}
.card-title{flex:1;min-width:0}
.card-name{font-family:var(--display);font-size:19px;line-height:1.15;display:block}
.card-meta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);display:block;margin-top:3px}
.card-title .entry-tag{display:inline-block;margin-top:6px;white-space:normal}
.card p{margin:7px 0 0;font-size:14px}
.card .note{color:var(--mute);font-size:13px}
.card .cue{font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--ink);
  border-left:2px solid var(--reel);background:rgba(138,107,31,.07);padding:6px 9px;margin-top:9px}
.card .cue b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--reel);font-weight:400;margin-bottom:3px}
.card-foot{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;margin-top:10px;
  font-family:var(--mono);font-size:10.5px}
.card-foot a,.card-foot button{color:var(--sea);text-decoration:none;border:0;background:none;
  font:inherit;padding:0;cursor:pointer;border-bottom:1px solid var(--sea-tint)}
.coord{color:var(--mute);font-family:var(--mono);font-size:10.5px}
.sec-note{font-size:12.5px;color:var(--mute);margin:0 0 14px}

/* ---------- chart ---------- */
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.lay{
  border:1px solid var(--rule);background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);padding:5px 7px;display:inline-flex;align-items:center;gap:6px;
}
.lay[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.lay:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.sw{width:9px;height:9px;display:inline-block;background:var(--ink)}
.sw.k-walk{border-radius:50%}
.sw.k-eat{background:var(--rosso)}
.sw.k-buy{background:var(--sea);transform:rotate(45deg)}
.sw.k-screen{background:var(--reel);border-radius:50%}
.sw.k-taste{background:var(--olio);clip-path:polygon(50% 0,100% 100%,0 100%)}
.seg{display:inline-flex}
.lay.wide{border-color:var(--ink);color:var(--ink)}
.seg .lay+.lay{border-left-width:0}
.lay.wide[aria-pressed="true"]{background:var(--ink);color:var(--stone)}

/* ---------- the view: drawn chart or real map ---------- */
.viewbox{position:relative;margin:0 0 12px;border:1px solid var(--ink);background:var(--sand)}
.viewbox.chart{padding:8px}
.viewbox.chart svg{display:block;width:100%;height:auto;max-height:70vh;margin:0 auto}
.viewbox.map{height:min(62vh,470px);overflow:hidden;touch-action:none;background:#E4E0D6;
  cursor:grab}
.viewbox.map:active{cursor:grabbing}
.chart-empty{font-family:var(--mono);font-size:11px;color:var(--mute);text-align:center;padding:40px 0}
.tiles{position:absolute;inset:0;filter:saturate(.68) contrast(.97)}
.tiles img{position:absolute;display:block;max-width:none;user-select:none;
  -webkit-user-drag:none;pointer-events:none}
.tiles img.dead{display:none}
.ovl{position:absolute;inset:0;width:100%;height:100%}
.ovl .pin circle,.ovl .pin rect{stroke:#FBFAF6;stroke-width:1.2}
.ovl .pin .halo{fill:#FBFAF6;fill-opacity:.7;stroke:#131E28;stroke-width:1.4}
.ovl .route{stroke:#131E28;stroke-width:1.6;opacity:.8;
  filter:drop-shadow(0 0 1.5px rgba(251,250,246,.95))}
.ovl .route.taste{stroke:#4F6B2F;stroke-dasharray:5 4}
.attrib{position:absolute;right:0;bottom:0;background:rgba(251,250,246,.86);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.02em;color:var(--mute);padding:2px 5px}
.attrib a{color:var(--sea)}
.zoomctl,.fsctl{position:absolute;top:8px;display:flex;flex-direction:column;gap:5px}
.zoomctl{left:8px}
.fsctl{right:8px}
.zoomctl button,.fsctl button{width:32px;height:32px;padding:0;border:1px solid var(--ink);
  background:rgba(251,250,246,.93);color:var(--ink);font:17px/1 var(--mono);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.fsctl svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:square;pointer-events:none}

/* full screen — native where the browser allows it, a fixed overlay everywhere else
   (iPhone Safari still refuses requestFullscreen on anything but a video) */
.viewbox.map.fs{position:fixed;inset:0;z-index:80;width:100%;height:100%;margin:0;border:0}
.viewbox.map.fs .zoomctl,.viewbox.map.fs .fsctl{top:calc(8px + env(safe-area-inset-top))}
.viewbox.map.fs .zoomctl{left:calc(8px + env(safe-area-inset-left))}
.viewbox.map.fs .fsctl{right:calc(8px + env(safe-area-inset-right))}
.viewbox.map.fs .attrib{bottom:env(safe-area-inset-bottom)}
body.fsmap{overflow:hidden}

/* ---------- locator bar ---------- */
.locbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.locnote{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--mute);
  flex:1;min-width:0}
.locnote strong{color:var(--sea);font-weight:400}
.locnote.warn{color:var(--rosso)}
.fromhere{font-family:var(--mono);font-size:10.5px;color:var(--sea)}

/* ---------- proximity buzz ---------- */
.buzzkey{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 10px;align-items:center}
.bzrow{
  border:1px solid var(--rule);background:transparent;cursor:pointer;padding:4px 7px;
  display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
}
.bzrow[data-off="true"]{opacity:.38}
.bzrow:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.bzpat{display:inline-flex;align-items:center;gap:2px;height:8px}
.bzpat i{display:block;height:8px;border-radius:1px;background:var(--ink)}
.bzpat.k-eat i{background:var(--rosso)}
.bzpat.k-taste i{background:var(--olio)}
.bzpat.k-buy i{background:var(--sea)}
.bzpat.k-screen i{background:var(--reel)}
.bzr{color:var(--sea);text-transform:none}
/* the borrowed iOS haptic — it has to be laid out to fire at all, so it is
   hidden by size and opacity rather than by display:none */
.haptic-switch{position:fixed;left:0;bottom:0;width:1px;height:1px;overflow:hidden;
  opacity:.01;pointer-events:none;z-index:-1;margin:0}
.haptic-switch input{margin:0;width:1px;height:1px;transform:scale(.02);transform-origin:0 0}
.buzznote{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--mute);
  flex:1 0 100%;margin:0;line-height:1.55}
.buzznote.warn{color:var(--rosso)}

/* the hail — a buzz is silent, and an iPhone will not vibrate from a web page at all,
   so every trigger also shows itself */
.hail{position:fixed;left:0;right:0;bottom:0;z-index:120;display:flex;justify-content:center;
  padding:0 14px calc(14px + env(safe-area-inset-bottom));pointer-events:none}
.hail-in{
  pointer-events:auto;display:flex;gap:10px;align-items:flex-start;width:100%;max-width:560px;
  background:var(--sand);border:1px solid var(--ink);border-left-width:4px;
  padding:10px 11px;box-shadow:3px 3px 0 rgba(19,30,40,.18);animation:hailup .26s ease;
}
.hail-in.k-walk{border-left-color:var(--ink)}
.hail-in.k-eat{border-left-color:var(--rosso)}
.hail-in.k-taste{border-left-color:var(--olio)}
.hail-in.k-buy{border-left-color:var(--sea)}
.hail-in.k-screen{border-left-color:var(--reel)}
@keyframes hailup{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hail-in{animation:none}}
.hail-body{flex:1;min-width:0}
.hail-kick{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);display:block}
.hail-name{font-family:var(--display);font-size:18px;line-height:1.15;display:block;margin-top:2px}
.hail-sub{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--sea);
  display:block;margin-top:3px}
.hail-go{background:none;border:0;border-bottom:1px solid var(--sea-tint);color:var(--sea);
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:0;margin-top:7px;cursor:pointer}
.hail-x{background:none;border:0;color:var(--mute);font:14px/1 var(--mono);cursor:pointer;
  padding:2px 0 2px 6px;flex:0 0 auto}
.hail-x:focus-visible,.hail-go:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
#me{pointer-events:none}   /* never let the blue dot swallow a tap on a pin */
.me-acc{fill:#1D5A6E;fill-opacity:.13;stroke:#1D5A6E;stroke-width:.6;stroke-opacity:.45}
.me-dot{fill:#1D5A6E;stroke:#FBFAF6;stroke-width:2}
.me-arrow{fill:#1D5A6E}
.me-lbl{font-family:Menlo,monospace;font-size:8px;fill:#1D5A6E;letter-spacing:.04em}
.off{border-top:1px solid var(--rule);margin-top:16px;padding-top:12px}
.off h3,.index h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);font-weight:400;margin:0 0 8px}
.offrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--rule);
  font-size:13.5px}
.offrow:first-of-type{border-top:0}
.offrow .bearing{font-family:var(--mono);font-size:10.5px;color:var(--sea);white-space:nowrap}
.offrow .oname{flex:1;min-width:0}
.offrow .osub{display:block;font-size:12px;color:var(--mute)}
.index{margin-top:16px}

    {n:"Quảng Ninh Museum shop", d:"The museum is a black glass box on the Hòn Gai shore, the best modern building in the province, with a good small shop of local craft, coal-carving and books.", c:"20.9500,107.0925"}

  screen:[

  know:[
    "Two days here: arrival 08:00 on 30 December, sailing 20:00 on 31 December. The clock above is set for the second day. New Year's Eve itself is at sea.",
    "The bay is a UNESCO site with a ticketed zone; entry is included in organised boats. Private boats must be licensed — book through the yacht or a known operator.",
    "Late December is cool, damp and often misty — 15–20°C, with a fine drizzle the Vietnamese call mưa phùn. Bring a layer and expect a softer, greyer bay than the brochures.",
    "Dong: roughly 25,000 to the US dollar. The 20,000 and 500,000 notes are both blue; check before you hand one over.",
    "Kayaking and swimming are only allowed in certain places. Your boat will tell you where."

{

  dock:{t:"Probably Phú Mỹ — about two hours from the city by road",
        d:"A yacht this size usually berths at Phú Mỹ on the Thị Vải river, 80 km out. Budget two hours each way, more in the evening rush: the walk projection below keeps two hours back for the drive. If the programme names a city berth on the Saigon river, set that aside and you have the whole day."},
  stops:[
    {n:"War Remnants Museum", dur:60, leg:8,
     w:"The American war as Vietnam tells it, in three floors of photographs, many by the photographers who died taking them. It is the most visited museum in the country and the hardest to walk out of.",
     l:"The Requiem gallery of war photographers' last pictures, and the tanks and aircraft in the yard outside.",
     x:"Opens 07:30. The Agent Orange rooms are harrowing; there is no obligation to see them.",
     c:"10.7795,106.6921"},
    {n:"Independence Palace", dur:60, leg:8,
     w:"The South Vietnamese presidential palace, rebuilt in 1966 in a sharp modernist concrete, where a North Vietnamese tank crashed through the gates on 30 April 1975. Inside, time stopped: the rooms, carpets and telephones are as they were that morning.",
     l:"The war room and the telex machines in the basement, and a replica of tank 843 on the lawn.",
     x:"Has historically closed for lunch, 11:00–13:00; check the board.",
     c:"10.7770,106.6953"},
    {n:"Notre-Dame Cathedral", dur:15, leg:2,
     w:"Built by the French between 1863 and 1880, entirely from materials shipped from France, down to the red Toulouse brick that has never faded.",
     l:"The Virgin statue in the square in front, which was reported to have wept in 2005.",
     x:"Under a long restoration; the façade may be scaffolded. Look from the square.",
     c:"10.7798,106.6990"},
    {n:"Central Post Office", dur:20, leg:10,
     w:"A great iron-and-glass hall of 1891, still a working post office. The two painted maps on the wall show Saigon and its telegraph lines as the colony saw them.",
     l:"Hồ Chí Minh's portrait at the end of the hall, over the counters, where the French governors' clocks once were.",
     x:"Send a postcard from here. It is what the building is for.",
     c:"10.7800,106.7000"},
    {n:"Opera House & the Hotel Continental", dur:20, leg:5,
     w:"The Municipal Theatre of 1900 faces the Continental across Đồng Khởi — the old rue Catinat. Graham Greene lived at the Continental and set The Quiet American on its terrace.",
     l:"The Continental's corner terrace, where Fowler drinks in the novel and the film.",
     x:"The Rex is a block along; its rooftop was the war correspondents' bar. See Drink this here.",
     c:"10.7766,106.7031"},
    {n:"Nguyễn Huệ & the Café Apartments", dur:40, leg:12,
     w:"A boulevard turned into a pedestrian mall from the People's Committee building to the river. Number 42, an old nine-storey apartment block, is now stacked floor by floor with tiny cafés and shops.",
     l:"The French colonial Hôtel de Ville at the top of the boulevard, lit gold at dusk.",
     x:"The lift in 42 charges a small fee; take the stairs.",
     c:"10.7747,106.7038"},
    {n:"Bến Thành Market", dur:45, leg:0,

     l:"The clock tower from the south gate, and the food hall — see the food tour.",
     x:"Prices for visitors start high. Closes about 18:00; the night market outside takes over.",
     c:"10.7725,106.6980"}
  ],
  eat:[

    {n:"Bánh Mì Huỳnh Hoa", t:"Bánh mì", d:"Lê Thị Riêng. The fattest bánh mì in the city, stuffed with pâté and cold cuts. Queue on the street.", c:"10.7712,106.6923"},
    {n:"Quán Ăn Ngon", t:"Street food, seated", d:"160 Pasteur. A colonial villa with street-food stalls around its garden. Every regional dish, at tables, with a menu in English.", c:"10.7788,106.6989"},
    {n:"Cục Gạch Quán", t:"Home cooking", d:"District 1, north of the centre. Old furniture, old recipes, the kind of Vietnamese home cooking the restaurants forgot. Book.", c:"10.7936,106.6905"}
  ],
  tasteNote:"Saigon eats on the pavement, at knee height, all day. The tour below is a lunch rather than a dinner, because the drive back to Phú Mỹ takes the evening.",
  taste:[
    {n:"Café Apartments, 42 Nguyễn Huệ", sp:"Cà phê sữa đá", pr:"₫35,000–60,000", dur:20, leg:10,

    {n:"Bến Thành Market food hall", sp:"Bún riêu, or chè", pr:"₫40,000–70,000", dur:25, leg:8,

     x:"Point, pay, sit.",

    {n:"Phở Hòa Pasteur", sp:"Phở bò", pr:"₫90,000–120,000", dur:25, leg:0,

  buy:[

{

  dock:{t:"At anchor — the marina day",
        d:"No pier big enough: the yacht anchors off and tenders to a beach or jetty. This is the day the marina opens off the stern. The island is 25 km long with one road; distances below are by songthaew (the pick-up taxi) or scooter."},
  stops:[

     x:"",

    {n:"Khlong Chao waterfall", dur:60, leg:25, by:"by car",
     w:"A short jungle walk leads to a broad cascade over rock ledges into a deep pool. Water in January is lower than after the rains but cool enough to swim.",
     l:"The fish in the pool nibbling your feet.",
     x:"Twenty minutes on foot from the road. Slippery rock; sandals, not flip-flops.",

    {n:"Makka Pai tree", dur:30, leg:20, by:"by car",

    {n:"Ao Tapao beach", dur:90, leg:0,

     l:"The water: it shades from turquoise to navy with almost no sand in it at all.",

  eat:[

    {n:"Soneva Kiri", t:"Destination", d:"The island's most famous resort, reached by its own airstrip. Its treepod dining — a table hoisted into the canopy and served by a waiter on a zip-line — needs booking well in advance and is the most extravagant lunch in Thailand.", c:"11.6880,102.5450"},
    {n:"Khlong Chao beach cafés", t:"Casual", d:"Where the creek meets the sea, a few wooden cafés doing Thai curries, fried rice and fruit shakes. Nothing remarkable and exactly right on a beach day.", c:"11.6300,102.5390"}
  ],
  tasteNote:"Koh Kood is an island of fishing villages and quiet resorts, not restaurants, and it is best treated as a swim with a lunch attached. The one meal worth arranging the day around is seafood over the water at Ao Salad.",
  taste:[
    {n:"A roadside fruit stall", sp:"Rambutan, mangosteen, pineapple", pr:"฿40–100", dur:10, leg:30,
     d:"The island grows fruit in the gardens behind every house, and stalls along the one road sell whatever is ripe, cut and bagged with a stick to eat it with. January is pineapple and papaya season; the rambutans are grown on the island.",
     o:"Whatever is cut and on ice. Ask for “prik gleua” — the chilli-salt-sugar dip — on the side.",
     x:"There is no fixed stall; the driver will stop at one.",
     c:"11.6420,102.5600"},
    {n:"Ao Salad", sp:"Crab and squid over the water", pr:"฿300–900", dur:60, leg:0,
     d:"A fishing village on the north-east coast where the restaurants stand on stilts over the jetty and the menu is what came in on the boats that morning: blue crab, squid, rock lobster, white snapper.",
     o:"Pla muk yang — grilled squid with a green chilli and lime sauce — and poo neung, steamed blue crab. Steamed fish with lime and garlic if there are more of you.",
     x:"Seafood is priced by weight. Ask the price per kilo before they weigh it.",
     c:"11.7050,102.5960"}
  ],
  sipNote:"A beach day, so the drinks are the ones a Thai would order sitting on the sand: the country's own rum, which it insists is whisky, and lime soda.",
  sip:[
    {t:"local", n:"Sang Som and soda", w:"Any beach bar", pr:"฿100–200",
     d:"Thailand's best-selling spirit, distilled from cane molasses and aged in oak — a rum, though Thais call it lao, whisky. Poured with soda and a great deal of ice, sometimes with a squeeze of lime. It is what is in the plastic buckets on the party islands, and it is better sipped than bucketed.",
     o:"“Sang Som soda, manao” — with soda and lime.",
     x:"On board the yacht is serving a better bottle, so this is the beach-bar drink rather than the evening one.",
     c:"11.6020,102.5430"},
    {t:"light", n:"Soda manao", w:"Any beach bar", pr:"฿50–80",
     d:"Fresh lime squeezed into soda with a pinch of salt and a spoon of sugar syrup. Salty, sour and sweet at once, which is the Thai idea of refreshment, and it is the best thing to drink at midday on a white beach.",
     o:"“Soda manao” — and “waan noi” if you want less sugar.",
     x:"",
     c:"11.6020,102.5430"}
  ],
  buyNote:"Nothing to buy on Koh Kood that is not made better or sold cheaper in Bangkok. Keep the baht for songthaews and lunch.",
  buy:[],
  screen:[

  know:[

/* ============================================================
   STATE — localStorage where available, memory otherwise.
   ============================================================ */
const mem = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v===null?mem[k]:v; }catch(e){ return mem[k]; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch(e){} }
};

let cur = store.get("sbhk.port") || PORTS[0].id;
if(!PORTS.some(p => p.id === cur)) cur = PORTS[0].id;
let tab = "walk";
const port = () => PORTS.find(p => p.id === cur);
const doneKey = id => "sbhk.done." + id;
const getDone = () => { try{ return JSON.parse(store.get(doneKey(cur)) || "[]"); }catch(e){ return []; } };
const setDone = a => store.set(doneKey(cur), JSON.stringify(a));
const timeKey = (id,which) => "sbhk." + which + "." + id;
/* Alongside every hand-set time we keep the printed time it was typed over.
   Without it an edit made on an old itinerary sits there for good, and the
   book quietly shows a sailing time the ship no longer keeps. */
const timeBaseKey = (id,which) => timeKey(id,which) + ".base";
function shipTime(id, which, printed){
  const set = store.get(timeKey(id,which));
  if(!set) return printed;
  if(store.get(timeBaseKey(id,which)) !== printed){   /* the itinerary moved under it */
    store.del(timeKey(id,which));
    store.del(timeBaseKey(id,which));
    return printed;
  }
  return set;
}
function setShipTime(id, which, v, printed){
  store.set(timeKey(id,which), v);
  store.set(timeBaseKey(id,which), printed);
}

const RAD = Math.PI/180;
function ll(c){
  if(!c) return null;

function kmBetween(a,b){
  const dLat=(b.lat-a.lat)*RAD, dLon=(b.lon-a.lon)*RAD;

  const y = Math.sin((b.lon-a.lon)*RAD)*Math.cos(b.lat*RAD);
  const x = Math.cos(a.lat*RAD)*Math.sin(b.lat*RAD) -
            Math.sin(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.cos((b.lon-a.lon)*RAD);
  const deg = (Math.atan2(y,x)/RAD + 360) % 360;
  return COMPASS[Math.round(deg/22.5) % 16];
}
const dist = km => km < 1 ? Math.round(km*1000) + " m" : km.toFixed(km<10?1:0) + " km";

/* --- the one list everything else reads --------------------- */
function points(p){
  const out = [];
  p.stops.forEach((s,i) => out.push(
    {k:"walk", i, num:i+1, n:s.n, c:s.c, sub:s.dur+" min", d:s.w, x:s.x}));
  (p.eat||[]).forEach((s,i) => out.push(
    {k:"eat", i, num:i+1, n:s.n, c:s.c, sub:"", tag:s.t, d:s.d}));
  (p.taste||[]).forEach((s,i) => out.push(
    {k:"taste", i, num:i+1, n:s.n, c:s.c, sub:s.sp + " · " + s.pr, tag:"Food tour " + (i+1),
     d:s.d, x:s.o + (s.x ? " " + s.x : "")}));
  (p.buy||[]).forEach((s,i) => out.push(
    {k:"buy", i, num:i+1, n:s.n, c:s.c,
     sub: s.t === "shop" ? s.who + " \u00b7 " + s.pr : "",
     tag: s.t === "shop" ? (s.off ? "Off the circuit" : "Shopping circuit") : "",
     d:s.d, x: s.o ? s.o + (s.x ? " " + s.x : "") : s.x}));
  (p.screen||[]).forEach((s,i) => out.push(
    {k:"screen", i, num:i+1, n:s.n, c:s.c, sub:[s.f, s.y].filter(Boolean).join(" · "), tag:s.r, d:s.d, x:s.x, q:s.q}));
  return out;
}
const keyOf = o => o.k + ":" + o.i;
const plotted = p => points(p).filter(o => ll(o.c));
function townCentre(p){
  const pts = p.stops.map(s => ll(s.c)).filter(Boolean);
  if(!pts.length) return {lat:0, lon:0};
  return {lat: pts.reduce((a,b)=>a+b.lat,0)/pts.length,
          lon: pts.reduce((a,b)=>a+b.lon,0)/pts.length};
}
const mapsHref = (c,n) => n
  ? "https://www.google.com/maps/search/" + encodeURIComponent(n) + "/@" + c + ",17z"
  : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(c);

function renderTide(){
  const a = minsToday($("#ashore").value), b = minsToday($("#allAboard").value);
  const n = nowMins(), clock = $("#tideClock"), fill = $("#tideFill");
  if(a===null || b===null || b<=a){ clock.textContent = "—"; fill.style.width = "0%"; return; }
  const left = b - n;
  const onShoreDay = n >= a && n <= b;
  if(onShoreDay){
    clock.textContent = hhmm(left);
    clock.classList.toggle("warn", left <= 60);
    fill.style.width = Math.min(100, Math.max(0, ((n-a)/(b-a))*100)) + "%";
  } else {
    clock.textContent = hhmm(b-a);
    clock.classList.remove("warn");
    fill.style.width = "0%";
  }
}

/* ============================================================
   RENDER — walk
   ============================================================ */
function renderWalk(){
  const p = port(), done = getDone();
  let out = "";

  // projection from first unchecked stop
  const first = p.stops.findIndex((s,i) => !done.includes(i));
  const b = minsToday($("#allAboard").value);
  if(first > -1 && b !== null){
    let need = 0;
    for(let i=first;i<p.stops.length;i++){ if(done.includes(i)) continue;
      need += p.stops[i].dur + (i < p.stops.length-1 ? p.stops[i].leg : 0); }
    const finish = nowMins() + need;
    const back = p.back || 0;          /* the drive or tender back to the yacht */
    const slack = b - back - finish;
    out += '<div class="proj' + (slack < 30 ? " tight" : "") + '"><b>If you start now</b>' +
      'Remaining stops need <strong>' + hhmm(need) + '</strong> — finishing around <strong>' +
      clockFromMins(finish) + '</strong>. ' +
      (slack >= 0
        ? 'That leaves ' + hhmm(slack) + (back
            ? ' before you need to set off back — ' + hhmm(back) + ' to the yacht.'
            : ' before ' + esc((p.aboardLabel || "all aboard").toLowerCase()) + '.')
        : '<strong>That is ' + hhmm(-slack) + (back
            ? ' past the time to set off back. Cut something.'
            : ' past ' + esc((p.aboardLabel || "all aboard").toLowerCase()) + '. Cut something.') + '</strong>') +
      '</div>';
  }

  out += '<ol class="rail">' + p.stops.map((s,i) => {
    const isDone = done.includes(i);
    return '<li class="stop' + (isDone?" done":"") + '" data-i="' + i + '">' +
      '<button class="dot" data-check="' + i + '" aria-label="Mark ' + esc(s.n) + ' done">' +
        (isDone ? "&#10003;" : (i+1)) + '</button>' +
      '<div class="stop-head" data-open="' + i + '">' +
        '<span class="stop-name">' + esc(s.n) + '</span>' +
        '<span class="stop-dur">' + s.dur + ' min</span>' +
      '</div>' +
      '<div class="stop-body">' +
        '<p>' + esc(s.w) + '</p>' +
        (s.l ? '<div class="look"><b>Look for</b>' + esc(s.l) + '</div>' : '') +
        (s.x ? '<p style="margin-top:8px;color:var(--mute);font-size:13.5px">' + esc(s.x) + '</p>' : '') +
        '<a class="geo" href="' + mapsHref(s.c, s.n) + '">' + s.c + ' · Maps</a>' +
        '<button class="geo btn" data-goto="walk:' + i + '">On chart</button>' +
        (i < p.stops.length-1 ? '<div class="leg">&darr; ' + s.leg + ' min ' + (s.by || 'walk') + ' to ' +
          esc(p.stops[i+1].n) + '</div>' : '') +
      '</div></li>';
  }).join("") + '</ol>';

  return out;
}
