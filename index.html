/* ============================================================
   WHERE AM I — the phone's own GPS. Needs no signal, only sky.
   ============================================================ */
const geo = {on:false, fix:null, err:null, id:null};

function startGeo(){
  if(!("geolocation" in navigator)){ geo.err = "This browser has no location service."; onFix(); return; }
  if(!window.isSecureContext){ geo.err = "Location needs a secure (https) page."; onFix(); return; }
  geo.on = true; geo.err = null; store.set("sbhk.geo","1");
  try{
    geo.id = navigator.geolocation.watchPosition(
      p => { geo.fix = {lat:p.coords.latitude, lon:p.coords.longitude,
                        acc:p.coords.accuracy || 0, t:p.timestamp};
             geo.err = null; onFix(); },
      e => { geo.err = e.code === 1
               ? "Location refused. Allow it for this site in your browser settings."
               : e.code === 2
               ? "No fix yet. GPS wants a view of the sky; stone alleys are slow."
               : "Location timed out. Try again in the open.";
             onFix(); },
      {enableHighAccuracy:true, maximumAge:4000, timeout:25000});
  }catch(e){ geo.on = false; geo.err = "Location unavailable."; onFix(); }
}
function stopGeo(){
  try{ if(geo.id != null) navigator.geolocation.clearWatch(geo.id); }catch(e){}
  geo.id = null; geo.on = false; geo.fix = null; geo.err = null;
  buzz.near = {}; buzz.loose = false; clearTimeout(buzz.retry); buzz.retry = 0; clearHail();
  store.del("sbhk.geo"); onFix();
}
function onFix(){
  checkProximity();          /* runs on every tab — the phone is usually in a pocket */
  if(tab !== "chart") return;
  paintLocBar();
  if(mode === "map" && geo.fix && followMe) centreOn(geo.fix.lat, geo.fix.lon);
  else paintMe();
}
function nearestTo(fix){
  let best = null;
  plotted(port()).forEach(o => {
    if(!layers[o.k]) return;
    const L = ll(o.c), d = kmBetween(fix, L);
    if(!best || d < best.km) best = {o, L, km:d};
  });
  return best;
}

/* ============================================================
   PROXIMITY BUZZ — the phone taps your leg when something comes
   within reach, in a rhythm that tells you what kind of thing it is,
   so you can keep your eyes on the street and the phone in a pocket.
   A buzz is silent and invisible, and an iPhone will not vibrate from
   a web page at all, so every hail also raises a card on the screen.
   ============================================================ */
/* One rhythm per kind, in milliseconds: sound, pause, sound, pause…  The same
   array drives all three channels, so the key drawn under the bar is honest
   whichever one your phone happens to have.  The pitches are a plain pentatonic
   — no two adjacent, so they stay apart in a noisy calle. */
const BUZZ = {
  walk:   {r:60, pat:[420],                hz:392.00},  /* one long    — a stop on the walk  */
  eat:    {r:45, pat:[90,80,90],           hz:587.33},  /* two short   — a kitchen           */
  taste:  {r:45, pat:[60,60,60,60,60],     hz:783.99},  /* three quick — a food-tour counter */
  buy:    {r:40, pat:[70,90,260],          hz:440.00},  /* short, long — a shop              */
  screen: {r:55, pat:[260,90,80,90,260],   hz:659.25}   /* clapper     — a filming location  */
};
const LEAVE   = 1.7;      /* how far out of the ring you must walk before it can hail again */
const ACC_MAX = 90;       /* a fix looser than this cannot tell 40 m from 400 */
const HAIL_GAP = 5000;    /* never two hails on top of each other */
const HAIL_HOLD = 12000;  /* how long the card stays up */

const buzz = {
  on: store.get("sbhk.buzz") !== "0",   /* on by default — it does nothing until location is */
  near: {},                           /* key -> true while you are still inside the ring   */
  last: 0,
  timer: 0,
  retry: 0,
  loose: false                        /* standing still on a fix too loose to trust        */
};
const sound = {on: store.get("sbhk.sound") === "1", ctx:null};   /* off until asked for */

/* --- channel 1: real vibration. Android has it; no iPhone does. ------------ */
const canVibrate = () => typeof navigator.vibrate === "function";
function fire(pat){
  if(!canVibrate()) return false;
  try{ return navigator.vibrate(pat); }catch(e){ return false; }
}

/* --- channel 2: the only tap an iPhone will give a web page ----------------
   Safari 17.4 draws <input type="checkbox" switch> as the native iOS toggle,
   and flipping one fires the system haptic. Borrowing it is undocumented and
   Apple may close it in any release, so it is a bonus, never the plan: one
   tap per beat of the rhythm, and the sound and the card carry the meaning. */
let swEl = null;
const canSwitch = () => {
  try{ return "switch" in document.createElement("input"); }catch(e){ return false; }
};
/* the input itself, not its label — clicking a label forwards a second click to
   the control, which would spend two haptics on every beat */
function switchEl(){
  if(swEl && swEl.isConnected) return swEl;
  const l = document.createElement("span");
  l.className = "haptic-switch";
  l.setAttribute("aria-hidden", "true");
  const i = document.createElement("input");
  i.type = "checkbox"; i.tabIndex = -1;
  try{ i.setAttribute("switch", ""); }catch(e){}
  l.appendChild(i);
  document.body.appendChild(l);
  swEl = i;
  return i;
}
function tapSwitch(pat){
  if(!canSwitch()) return false;
  const el = switchEl();
  let t = 0;
  for(let i = 0; i < pat.length; i += 2){
    setTimeout(() => { try{ el.click(); }catch(e){} }, t);
    t += pat[i] + (pat[i+1] || 0);
  }
  return true;
}

/* --- channel 3: a tone, for the phones that will do neither ---------------- */
function audioCtx(){
  if(sound.ctx) return sound.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  try{ sound.ctx = new AC(); }catch(e){ return null; }
  return sound.ctx;
}
const canSound = () => !!(window.AudioContext || window.webkitAudioContext);
/* iOS starts every context asleep and only a real finger may wake it */
function unlockAudio(){
  if(!sound.on) return;
  const c = audioCtx();
  if(c && c.state === "suspended"){ try{ c.resume(); }catch(e){} }
}
function chime(k){
  const c = audioCtx(); if(!c) return false;
  if(c.state === "suspended"){ try{ c.resume(); }catch(e){} }
  const pat = BUZZ[k].pat, hz = BUZZ[k].hz;
  let t = c.currentTime + 0.02;
  for(let i = 0; i < pat.length; i += 2){
    const dur = Math.max(0.05, pat[i]/1000);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = "sine";
    osc.frequency.value = hz;
    g.gain.setValueAtTime(0.0001, t);                      /* a ramp, or it clicks */
    g.gain.exponentialRampToValueAtTime(0.20, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.03);
    t += dur + (pat[i+1] || 0)/1000;
  }
  return true;
}

/* Every channel this phone has, at once. Returns true if anything was felt. */
function signal(k){
  const pat = BUZZ[k].pat;
  let felt = fire(pat);
  if(!felt) felt = tapSwitch(pat);
  if(sound.on) chime(k);
  return felt || sound.on;
}

/* The watch only speaks when you move, so a hail held back for any reason has to
   ask to be looked at again — otherwise standing still is the same as being told
   nothing at all. */
function recheckIn(ms){
  clearTimeout(buzz.retry);
  buzz.retry = setTimeout(() => { buzz.retry = 0; checkProximity(); }, ms);
}

/* Returns true when it actually hailed. */
function checkProximity(){
  clearTimeout(buzz.retry); buzz.retry = 0;
  const was = buzz.loose; buzz.loose = false;
  const note = () => { if(was !== buzz.loose && tab === "chart") paintBuzzKey(); };
  if(!buzz.on || !geo.on || !geo.fix){ note(); return false; }
  const fix = geo.fix;
  if(fix.acc > ACC_MAX){                  /* keep the rings armed, just do not trust this fix */
    buzz.loose = true; note(); return false;
  }
  note();

  const done = getDone();
  let hit = null;
  plotted(port()).forEach(o => {
    const cfg = BUZZ[o.k]; if(!cfg) return;
    const k = keyOf(o), L = ll(o.c), m = kmBetween(fix, L)*1000;
    if(buzz.near[k]){ if(m > cfg.r*LEAVE) delete buzz.near[k]; return; }
    if(!layers[o.k]) return;                              /* layer off — no hail  */
    if(o.k === "walk" && done.includes(o.i)) return;      /* stop already ticked  */
    if(m <= cfg.r && (!hit || m < hit.m)) hit = {o, L, m, cfg, k};
  });
  if(!hit) return false;

  const t = Date.now();
  if(t - buzz.last < HAIL_GAP){                /* one hail at a time — come back for this one */
    recheckIn(HAIL_GAP - (t - buzz.last) + 60);
    return false;
  }
  buzz.last = t;
  buzz.near[hit.k] = true;                     /* armed again only once you walk back out  */
  signal(hit.o.k);
  showHail(hit);
  recheckIn(HAIL_GAP + 60);      /* two pins on one corner get one hail each, in turn */
  return true;
}

/* Native full screen paints nothing outside the element that asked for it, so the
   card has to live inside the map while the map has the screen to itself. */
function hailHome(){
  let host = $("#hail");
  if(!host){
    host = document.createElement("div");
    host.className = "hail"; host.id = "hail";
    host.setAttribute("role", "status");
    host.setAttribute("aria-live", "polite");
  }
  const parent = fsElement() || document.body;
  if(host.parentNode !== parent) parent.appendChild(host);
  return host;
}
function rehomeHail(){ if($("#hail")) hailHome(); }

function showHail(h){
  const o = h.o;
  const host = hailHome();
  host.innerHTML =
    '<div class="hail-in k-' + o.k + '">' + glyph(o.k, o.num) +
      '<div class="hail-body">' +
        '<span class="hail-kick">' + esc(KIND[o.k].t) + ' &middot; within reach</span>' +
        '<span class="hail-name">' + esc(o.n) + '</span>' +
        '<span class="hail-sub">' + Math.round(h.m) + ' m ' + compass(geo.fix, h.L) +
          (o.sub ? ' &middot; ' + esc(o.sub) : '') + '</span>' +
        '<button class="hail-go" data-goto="' + h.k + '">Show on map</button>' +
      '</div>' +
      '<button class="hail-x" data-hailx="1" aria-label="Dismiss">&times;</button>' +
    '</div>';
  clearTimeout(buzz.timer);
  buzz.timer = setTimeout(clearHail, HAIL_HOLD);
}
function clearHail(){
  clearTimeout(buzz.timer);
  const h = $("#hail"); if(h) h.remove();
}

/* ============================================================
   RENDER — the view. Two of them:
     chart  a drawn plot from the coordinates. No network, ever.
     map    real OpenStreetMap tiles, when there is a signal.
   Both carry the same pins and both show your own position.
   ============================================================ */
const VB = {w:380, l:24, r:12, t:12, b:24};   /* height is set per chart, from the ground */
let mode = (store.get("sbhk.mode") === "map") ? "map" : "chart";
let mapView = null;                 /* {lat, lon, z} — rebuilt per port */
let followMe = false;
let mapFull = false;                /* map blown up to the whole screen */
let proj = null;                    /* {toXY, W, H, mPerUnit, svg} for whichever view is up */
let tiles = new Map();              /* live tile <img> elements, keyed z/x/y */

const TILE_URL = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const MINZ = 11, MAXZ = 19;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* --- Web Mercator, the projection the tiles are cut on ------- */
const mercY = lat => Math.log(Math.tan(Math.PI/4 + clamp(lat,-85,85)*RAD/2));
function worldPx(lat, lon, z){
  const s = 256*Math.pow(2, z);
  return {x:(lon+180)/360*s, y:(0.5 - mercY(lat)/(2*Math.PI))*s};
}
function pxToLL(x, y, z){
  const s = 256*Math.pow(2, z);
  return {lon: x/s*360 - 180,
          lat: (2*Math.atan(Math.exp((0.5 - y/s)*2*Math.PI)) - Math.PI/2)/RAD};
}
const mPerPx = (lat, z) => 156543.03392*Math.cos(lat*RAD)/Math.pow(2, z);

/* --- the working set ---------------------------------------- */
function chartSets(){
  const p = port(), centre = townCentre(p), R = p.townKm || TOWN_KM;
  const all = plotted(p).map(o => Object.assign({}, o, {ll: ll(o.c)}));
  const near = all.filter(o => kmBetween(centre, o.ll) <= R);
  const far  = all.filter(o => kmBetween(centre, o.ll) >  R);
  const pool = (mode === "map" || fitAll) ? all : near;
  return {p, centre, all, near, far, shown: pool.filter(o => layers[o.k])};
}

/* ============================================================
   The shell — toolbar, locator bar, view host, card, index
   ============================================================ */
function chartShell(){
  const s = chartSets();
  let html = '<div class="tools">' +
    '<span class="seg">' +
      '<button class="lay wide" data-setmode="chart" aria-pressed="' + (mode==="chart") +
        '">Chart</button>' +
      '<button class="lay wide" data-setmode="map" aria-pressed="' + (mode==="map") +
        '">Map</button></span>' +
    Object.keys(KIND).map(k => {
      const n = s.all.filter(o => o.k===k).length;
      return '<button class="lay" data-layer="' + k + '" aria-pressed="' + !!layers[k] + '">' +
        '<span class="sw k-' + k + '"></span>' + esc(KIND[k].t) + ' ' + n + '</button>';
    }).join("") +
    (mode==="map"
      ? '<button class="lay" data-fitport="1">Fit port</button>'
      : '<button class="lay" data-fit="1" aria-pressed="' + fitAll + '">' +
        (fitAll ? "Whole coast" : "Town only") + '</button>') +
    '<button class="lay" data-gpx="1">Download .gpx</button>' +
  '</div>';

  html += '<div class="locbar" id="locbar"></div>';
  html += '<div class="buzzkey" id="buzzkey"></div>';
  html += '<div class="viewbox ' + mode + (mode==="map" && mapFull ? ' fs' : '') +
          '" id="viewbox"></div>';
  html += '<div id="chartCard"></div>';

  html += '<div class="index"><h3>Index</h3>' + (s.shown.length
    ? s.shown.map(o => {
        const k = keyOf(o);
        return '<button class="ixrow" data-pin="' + k + '" aria-current="' + (sel===k) + '">' +
          glyph(o.k, o.num) + '<span class="ixname">' + esc(o.n) + '</span>' +
          '<span class="ixsub">' + esc(KIND[o.k].t) + '</span></button>';
      }).join("")
    : '<p class="sec-note">Nothing plotted — switch a layer back on.</p>') +
    '<p class="sec-note" style="margin-top:12px">Decimal degrees, WGS 84 — the same numbers your ' +
    'phone reads. In the cities pins are good to a block; on the islands and in the bay they mark ' +
    'the village, the beach or the cave rather than a door — close enough to point a driver or a ' +
    'boatman at, which is all they are for.' +
    (mode==="chart" ? ' Where two pins would collide on the chart the marker is nudged clear and a ' +
      'hairline points back to the true position.' : '') + '</p></div>';

  html += offList(s.far, s.centre);
  return html;
}

function offList(far, centre){
  if(mode === "map" || fitAll || !far.length) return "";
  const rows = far.filter(o => layers[o.k]).sort((a,b) =>
    kmBetween(centre,a.ll) - kmBetween(centre,b.ll));
  if(!rows.length) return "";
  return '<div class="off"><h3>Off the chart</h3>' + rows.map(o =>
    '<div class="offrow">' + glyph(o.k, o.num) +
      '<span class="oname">' + esc(o.n) +
        '<span class="osub">' + esc(o.sub || "") + '</span></span>' +
      '<span class="bearing">' + compass(centre, o.ll) + ' ' + dist(kmBetween(centre, o.ll)) + '</span>' +
    '</div>').join("") +
    '<p class="sec-note" style="margin-top:10px">Bearings and distances are from the middle of the ' +
    'day\'s stops. Switch to <strong>whole coast</strong>, or to the map, to plot them.</p></div>';
}

function drawView(){
  if(mode === "map") drawMap(); else drawChart();
  paintMe(); paintSel(); paintLocBar();
}

/* ============================================================
   Locator bar
   ============================================================ */
function paintLocBar(){
  const bar = $("#locbar"); if(!bar) return;
  let btns, note;
  if(!geo.on){
    btns = '<button class="lay" data-geo="on">Show where I am</button>';
    note = '<span class="locnote">The phone\'s own GPS. It works with no signal.</span>';
  } else if(geo.err){
    btns = '<button class="lay" data-geo="off" aria-pressed="true">Location on</button>';
    note = '<span class="locnote warn">' + esc(geo.err) + '</span>';
  } else if(!geo.fix){
    btns = '<button class="lay" data-geo="off" aria-pressed="true">Location on</button>';
    note = '<span class="locnote">Waiting for a fix…</span>';
  } else {
    const n = nearestTo(geo.fix);
    btns = '<button class="lay" data-geo="off" aria-pressed="true">Location on</button>' +
      (mode === "map"
        ? '<button class="lay" data-geo="follow" aria-pressed="' + followMe + '">Follow</button>'
        : '');
    note = '<span class="locnote">&plusmn;' + Math.round(geo.fix.acc) + ' m' +
        (n ? ' &middot; nearest ' + esc(n.o.n) + ' <strong>' + dist(n.km) + ' ' +
             compass(geo.fix, n.L) + '</strong>' : '') + '</span>';
  }
  if(geo.on){
    btns += '<button class="lay" data-buzz="1" aria-pressed="' + buzz.on + '">' +
      (canVibrate() ? "Buzz" : "Hail") + ' near</button>';
    if(buzz.on && canSound())
      btns += '<button class="lay" data-sound="1" aria-pressed="' + sound.on + '">Sound</button>';
  }
  bar.innerHTML = btns + note;
  paintBuzzKey();
}

/* the rhythms, drawn as they are felt — and tappable, so you can learn them
   before you need them (a tap is also the gesture some browsers want before
   they will vibrate at all) */
function paintBuzzKey(){
  const el = $("#buzzkey"); if(!el) return;
  if(!geo.on || !buzz.on){ el.innerHTML = ""; return; }
  el.innerHTML = Object.keys(BUZZ).map(k => {
    const bars = BUZZ[k].pat.filter((v,i) => i % 2 === 0)
      .map(ms => '<i style="width:' + Math.max(3, Math.round(ms/26)) + 'px"></i>').join("");
    return '<button class="bzrow" data-bztest="' + k + '" data-off="' + !layers[k] + '"' +
      ' aria-label="' + esc(KIND[k].t) + ', ' + BUZZ[k].r + ' metres' +
      (layers[k] ? '' : ' — layer switched off, it will not hail you') + '. Tap to feel the rhythm.">' +
      '<span class="bzpat k-' + k + '">' + bars + '</span>' + esc(KIND[k].t) +
      ' <span class="bzr">' + BUZZ[k].r + '&thinsp;m</span></button>';
  }).join("") +
  '<p class="buzznote' + (buzz.loose ? ' warn' : '') + '">' + (buzz.loose
    ? "Fix is loose to &plusmn;" + Math.round(geo.fix.acc) + " m — too vague to say you are at a door. " +
      "Nothing will buzz until it tightens."
    : howItHails()) +
  '</p>';
}

/* Say what this particular phone will actually do — no phone does all of it */
function howItHails(){
  const tail = " Each pin hails once; walk out and back to be hailed again. " +
               "Layers switched off stay quiet.";
  if(canVibrate())
    return "Tap a rhythm to feel it." + tail;
  if(canSwitch())
    return "No iPhone vibrates from a web page. This one borrows Safari&rsquo;s switch haptic — " +
           "one tap a beat, and Apple may take it back, so turn Sound on for the whole rhythm." + tail;
  return "This browser will neither vibrate nor tap. Turn Sound on, or watch for the card." + tail;
}

/* ============================================================
   Your position, painted into whichever view is up
   ============================================================ */
function paintMe(){
  if(!proj || !proj.svg || !proj.svg.isConnected) return;
  const old = proj.svg.querySelector("#me"); if(old) old.remove();
  if(!geo.on || !geo.fix) return;

  const NS = "http://www.w3.org/2000/svg";
  const g = document.createElementNS(NS, "g");
  g.setAttribute("id","me");
  const pt = proj.toXY(geo.fix.lat, geo.fix.lon);
  const inside = pt.x >= 2 && pt.x <= proj.W-2 && pt.y >= 2 && pt.y <= proj.H-2;

  if(inside){
    const r = clamp(geo.fix.acc/proj.mPerUnit, 5, proj.W);
    g.innerHTML =
      '<circle class="me-acc" cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) +
        '" r="' + r.toFixed(1) + '"/>' +
      '<circle class="me-dot" cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="5"/>';
  } else {
    /* off the edge — point at it, and say how far */
    const cx = proj.W/2, cy = proj.H/2;
    const dx = pt.x - cx, dy = pt.y - cy;
    const m = Math.max(Math.abs(dx)/(proj.W/2 - 16), Math.abs(dy)/(proj.H/2 - 16), 1e-6);
    const ex = cx + dx/m, ey = cy + dy/m;
    const ang = Math.atan2(dy, dx)*180/Math.PI + 90;
    const centre = townCentre(port());
    g.innerHTML =
      '<g transform="translate(' + ex.toFixed(1) + ',' + ey.toFixed(1) + ') rotate(' +
        ang.toFixed(1) + ')"><polygon class="me-arrow" points="0,-10 6.5,6 -6.5,6"/></g>' +
      '<text class="me-lbl" x="' + clamp(ex, 30, proj.W-30).toFixed(1) + '" y="' +
        clamp(ey + (dy>0 ? -14 : 20), 12, proj.H-6).toFixed(1) +
        '" text-anchor="middle">you &middot; ' +
        esc(dist(kmBetween(centre, geo.fix)) + " " + compass(centre, geo.fix)) + '</text>';
  }
  proj.svg.appendChild(g);
}

/* ============================================================
   Selection — patched in place so the map is not torn down
   ============================================================ */
function paintSel(){
  const host = $("#chartCard");
  if(host){
    const o = chartSets().shown.find(x => keyOf(x) === sel);
    host.innerHTML = o ? card(o) : "";
  }
  document.querySelectorAll(".ixrow").forEach(r =>
    r.setAttribute("aria-current", r.dataset.pin === sel));
  document.querySelectorAll("g[data-pin]").forEach(g =>
    g.classList.toggle("on", g.dataset.pin === sel));
}

function selectPin(k, centreIt){
  sel = (sel === k && !centreIt) ? null : k;
  if(mode === "map"){
    if(sel && centreIt){
      const o = chartSets().all.find(x => keyOf(x) === sel);
      if(o){ followMe = false; mapView.lat = o.ll.lat; mapView.lon = o.ll.lon;
             mapView.z = Math.max(mapView.z, 17); drawMap(); paintMe(); }
    } else drawOverlay();
  } else { drawChart(); paintMe(); }
  paintSel(); paintLocBar();
}

/* ============================================================
   The drawn chart — no tiles, no network
   ============================================================ */
const GRID_STEPS = [0.5,0.2,0.1,0.05,0.02,0.01,0.005,0.002,0.001,0.0005];
const BAR_STEPS  = [10,20,50,100,200,500,1000,2000,5000,10000,20000,50000];
function niceStep(span){
  for(const s of GRID_STEPS){ const n = span/s; if(n >= 2 && n <= 6) return s; }
  return GRID_STEPS[GRID_STEPS.length-1];
}

function drawChart(){
  const host = $("#viewbox"); if(!host) return;
  tiles = new Map();
  const {p, shown} = chartSets();
  if(!shown.length){
    host.innerHTML = '<div class="chart-empty">Nothing to plot — switch a layer back on.</div>';
    proj = null; return;
  }

  /* equirectangular, north up */
  const centre = townCentre(p);
  const kx = Math.cos(centre.lat * RAD);
  const px = o => o.ll.lon * kx, py = o => -o.ll.lat;
  let x0 = Math.min(...shown.map(px)), x1 = Math.max(...shown.map(px));
  let y0 = Math.min(...shown.map(py)), y1 = Math.max(...shown.map(py));
  const MINSPAN = 0.0035;                       /* ~390 m — stops absurd zoom */
  if(x1-x0 < MINSPAN*kx){ const m=(x0+x1)/2, h=MINSPAN*kx/2; x0=m-h; x1=m+h; }
  if(y1-y0 < MINSPAN){ const m=(y0+y1)/2, h=MINSPAN/2; y0=m-h; y1=m+h; }
  const padX = (x1-x0)*0.10, padY = (y1-y0)*0.10;
  x0-=padX; x1+=padX; y0-=padY; y1+=padY;

  /* the frame takes the shape of the ground, within reason — no dead paper */
  const iw = VB.w - VB.l - VB.r;
  const ih = Math.round(Math.min(Math.max(iw*((y1-y0)/(x1-x0)), iw*0.62), iw*1.30));
  const H  = ih + VB.t + VB.b;
  const scale = Math.min(iw/(x1-x0), ih/(y1-y0));
  const cx = (x0+x1)/2, cy = (y0+y1)/2;
  const SX = v => VB.l + iw/2 + (v - cx)*scale;
  const SY = v => VB.t + ih/2 + (v - cy)*scale;

  /* graticule */
  const latStep = niceStep(y1-y0), lonStep = niceStep((x1-x0)/kx);
  const dec = s => Math.max(0, Math.ceil(-Math.log10(s)));
  let grid = "", ticks = "";
  for(let v = Math.ceil(-y1/latStep)*latStep; v <= -y0+1e-9; v += latStep){
    const Y = SY(-v);
    grid += '<line x1="' + VB.l + '" y1="' + Y.toFixed(1) + '" x2="' + (VB.w-VB.r) +
            '" y2="' + Y.toFixed(1) + '"/>';
    ticks += '<text x="' + (VB.l-3) + '" y="' + (Y+3).toFixed(1) +
             '" text-anchor="end" class="tk">' + v.toFixed(dec(latStep)) + '</text>';
  }
  for(let v = Math.ceil((x0/kx)/lonStep)*lonStep; v <= x1/kx+1e-9; v += lonStep){
    const X = SX(v*kx);
    grid += '<line x1="' + X.toFixed(1) + '" y1="' + VB.t + '" x2="' + X.toFixed(1) +
            '" y2="' + (H-VB.b) + '"/>';
    ticks += '<text x="' + X.toFixed(1) + '" y="' + (H-VB.b+11) +
             '" text-anchor="middle" class="tk">' + v.toFixed(dec(lonStep)) + '</text>';
  }

  /* walking route, and the food tour's own line under it */
  let route = "";
  const walk = shown.filter(o => o.k==="walk").sort((a,b)=>a.i-b.i);
  if(walk.length > 1){
    route = '<polyline class="route" points="' +
      walk.map(o => SX(px(o)).toFixed(1) + "," + SY(py(o)).toFixed(1)).join(" ") + '"/>';
  }
  const tour = shown.filter(o => o.k==="taste").sort((a,b)=>a.i-b.i);
  if(tour.length > 1){
    route += '<polyline class="route taste" points="' +
      tour.map(o => SX(px(o)).toFixed(1) + "," + SY(py(o)).toFixed(1)).join(" ") + '"/>';
  }

  /* de-collide markers, keeping a leader to the true spot */
  const nodes = shown.map(o => {
    const X = SX(px(o)), Y = SY(py(o));
    return {o, x0:X, y0:Y, x:X, y:Y};
  });
  const MIN = 22, CAP = 26;
  for(let it=0; it<90; it++){
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a=nodes[i], b=nodes[j];
        let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
        if(d >= MIN) continue;
        if(d < 0.01){ dx = (i%2?1:-1)*0.6; dy = (j%2?1:-1)*0.6; d = Math.hypot(dx,dy); }
        const push = (MIN-d)/2 * 0.45 / d;
        a.x -= dx*push; a.y -= dy*push; b.x += dx*push; b.y += dy*push;
      }
    }
    nodes.forEach(n => { n.x += (n.x0-n.x)*0.03; n.y += (n.y0-n.y)*0.03; });
  }
  nodes.forEach(n => {
    let dx=n.x-n.x0, dy=n.y-n.y0, d=Math.hypot(dx,dy);
    if(d > CAP){ n.x = n.x0 + dx/d*CAP; n.y = n.y0 + dy/d*CAP; }
    n.x = clamp(n.x, VB.l+11, VB.w-VB.r-11);
    n.y = clamp(n.y, VB.t+11, H-VB.b-11);
  });

  let leaders = "", pins = "";
  nodes.forEach(n => {
    if(Math.hypot(n.x-n.x0, n.y-n.y0) > 4){
      leaders += '<line class="lead" x1="' + n.x0.toFixed(1) + '" y1="' + n.y0.toFixed(1) +
                 '" x2="' + n.x.toFixed(1) + '" y2="' + n.y.toFixed(1) + '"/>' +
                 '<circle class="true" cx="' + n.x0.toFixed(1) + '" cy="' + n.y0.toFixed(1) + '" r="1.4"/>';
    }
    pins += pinSVG(n.o, n.x, n.y);
  });

  /* scale bar and north arrow */
  const mPerUnit = 110574/scale;
  let barM = BAR_STEPS[0];
  for(const s of BAR_STEPS){ barM = s; if(s/mPerUnit >= 45) break; }
  const barLen = barM/mPerUnit;
  const bx = VB.l + 4, by = H - VB.b - 8;
  const bar = '<g class="bar"><line x1="' + bx + '" y1="' + by + '" x2="' + (bx+barLen).toFixed(1) +
    '" y2="' + by + '"/><line x1="' + bx + '" y1="' + (by-3) + '" x2="' + bx + '" y2="' + (by+3) + '"/>' +
    '<line x1="' + (bx+barLen).toFixed(1) + '" y1="' + (by-3) + '" x2="' + (bx+barLen).toFixed(1) +
    '" y2="' + (by+3) + '"/><text x="' + (bx+barLen/2).toFixed(1) + '" y="' + (by-6) +
    '" text-anchor="middle" class="tk">' + (barM<1000 ? barM+" m" : (barM/1000)+" km") + '</text></g>';
  const nx = VB.w - VB.r - 12, ny = VB.t + 10;
  const north = '<g class="rose"><line x1="' + nx + '" y1="' + (ny+16) + '" x2="' + nx + '" y2="' + ny +
    '"/><polygon points="' + nx + ',' + (ny-4) + ' ' + (nx-3.2) + ',' + (ny+2) + ' ' +
    (nx+3.2) + ',' + (ny+2) + '"/><text x="' + nx + '" y="' + (ny+26) +
    '" text-anchor="middle" class="tk">N</text></g>';

  host.innerHTML = '<svg viewBox="0 0 ' + VB.w + ' ' + H +
    '" role="img" aria-label="Chart of ' + esc(p.name) + '">' +
    '<g class="gr">' + grid + '</g>' +
    '<rect class="frm" x="' + VB.l + '" y="' + VB.t + '" width="' + iw + '" height="' + ih + '"/>' +
    ticks + route + leaders + bar + north + pins + '</svg>';

  const svg = host.querySelector("svg");
  proj = {svg, W:VB.w, H, mPerUnit,
          toXY:(lat,lon) => ({x:SX(lon*kx), y:SY(-lat)})};
}

/* ============================================================
   The real map — OpenStreetMap tiles under the same pins
   ============================================================ */
function fitZoom(list, W, H){
  if(!list.length) return 16;
  const lats = list.map(o=>o.ll.lat), lons = list.map(o=>o.ll.lon);
  const a = {lat:Math.max(...lats), lon:Math.min(...lons)};
  const b = {lat:Math.min(...lats), lon:Math.max(...lons)};
  for(let z = MAXZ; z >= MINZ; z--){
    const p1 = worldPx(a.lat, a.lon, z), p2 = worldPx(b.lat, b.lon, z);
    if((p2.x-p1.x) <= W*0.84 && (p2.y-p1.y) <= H*0.84) return z;
  }
  return MINZ;
}

function fitPort(){
  const host = $("#viewbox"); if(!host) return;
  const s = chartSets();
  /* frame the town, not the day trips — the far pins are still on the map,
     they are just outside the opening view. */
  const town = s.near.filter(o => layers[o.k]);
  const list = town.length ? town : (s.shown.length ? s.shown : s.all);
  const lats = list.map(o=>o.ll.lat), lons = list.map(o=>o.ll.lon);
  mapView = {
    lat: (Math.max(...lats)+Math.min(...lats))/2,
    lon: (Math.max(...lons)+Math.min(...lons))/2,
    z: fitZoom(list, host.clientWidth || 360, host.clientHeight || 420)
  };
  followMe = false;
}
function centreOn(lat, lon){
  if(!mapView) return;
  mapView.lat = lat; mapView.lon = lon;
  drawMap(); paintMe();
}

function drawMap(){
  const host = $("#viewbox"); if(!host) return;
  if(!host.querySelector(".tiles")){
    tiles = new Map();
    host.innerHTML =
      '<div class="tiles"></div>' +
      '<svg class="ovl"></svg>' +
      '<div class="zoomctl">' +
        '<button data-zoom="1" aria-label="Zoom in">+</button>' +
        '<button data-zoom="-1" aria-label="Zoom out">&minus;</button></div>' +
      '<div class="fsctl"><button data-fullmap="1"></button></div>' +
      '<div class="attrib">&copy; <a href="https://www.openstreetmap.org/copyright" ' +
        'target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>';
    paintFullBtn();
    bindMapGestures(host);
    watchMapSize(host);
  }
  const W = host.clientWidth, H = host.clientHeight;
  if(!W || !H) return;
  if(!mapView) fitPort();

  const c = worldPx(mapView.lat, mapView.lon, mapView.z);
  const oX = c.x - W/2, oY = c.y - H/2;

  /* tiles */
  const layer = host.querySelector(".tiles");
  const tz = clamp(Math.round(mapView.z), MINZ, MAXZ);
  const k = Math.pow(2, mapView.z - tz);
  const n = Math.pow(2, tz), size = 256*k;
  const wx = oX/k, wy = oY/k;
  const tx0 = Math.floor(wx/256), tx1 = Math.floor((wx + W/k)/256);
  const ty0 = Math.floor(wy/256), ty1 = Math.floor((wy + H/k)/256);
  const want = new Set();
  for(let tx = tx0; tx <= tx1; tx++){
    for(let ty = ty0; ty <= ty1; ty++){
      if(ty < 0 || ty >= n) continue;
      const wrap = ((tx % n) + n) % n, key = tz+"/"+wrap+"/"+ty;
      want.add(key);
      let img = tiles.get(key);
      if(!img){
        img = new Image(); img.alt = ""; img.decoding = "async";
        img.addEventListener("error", () => img.classList.add("dead"));
        img.src = TILE_URL.replace("{z}",tz).replace("{x}",wrap).replace("{y}",ty);
        layer.appendChild(img); tiles.set(key, img);
      }
      img.style.width = img.style.height = size.toFixed(2)+"px";
      img.style.left = (tx*256*k - oX).toFixed(2)+"px";
      img.style.top  = (ty*256*k - oY).toFixed(2)+"px";
    }
  }
  tiles.forEach((el, key) => { if(!want.has(key)){ el.remove(); tiles.delete(key); } });

  proj = {svg: host.querySelector(".ovl"), W, H,
          mPerUnit: mPerPx(mapView.lat, mapView.z),
          toXY:(lat,lon) => { const q = worldPx(lat, lon, mapView.z);
                              return {x:q.x-oX, y:q.y-oY}; }};
  proj.svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  drawOverlay();
}

function drawOverlay(){
  if(!proj || !proj.svg) return;
  const {shown} = chartSets();
  let route = "";
  const walk = shown.filter(o => o.k==="walk").sort((a,b)=>a.i-b.i);
  if(walk.length > 1){
    route = '<polyline class="route" points="' + walk.map(o => {
      const q = proj.toXY(o.ll.lat, o.ll.lon);
      return q.x.toFixed(1)+","+q.y.toFixed(1);
    }).join(" ") + '"/>';
  }
  const tour = shown.filter(o => o.k==="taste").sort((a,b)=>a.i-b.i);
  if(tour.length > 1){
    route += '<polyline class="route taste" points="' + tour.map(o => {
      const q = proj.toXY(o.ll.lat, o.ll.lon);
      return q.x.toFixed(1)+","+q.y.toFixed(1);
    }).join(" ") + '"/>';
  }
  const pins = shown.map(o => {
    const q = proj.toXY(o.ll.lat, o.ll.lon);
    return (q.x > -30 && q.x < proj.W+30 && q.y > -30 && q.y < proj.H+30)
      ? pinSVG(o, q.x, q.y) : "";
  }).join("");
  proj.svg.innerHTML = route + pins;
  paintMe();
}

function pinSVG(o, x, y){
  const k = keyOf(o), col = KIND[o.k].col;
  let shape;
  if(o.k === "walk")       shape = '<circle r="9.6" fill="' + col + '"/>';
  else if(o.k === "eat")   shape = '<rect x="-8.4" y="-8.4" width="16.8" height="16.8" fill="' + col + '"/>';
  else if(o.k === "taste") shape = '<polygon points="0,-11.5 10.5,7 -10.5,7" fill="' + col + '"/>';
  else if(o.k === "buy")   shape = '<rect x="-8" y="-8" width="16" height="16" transform="rotate(45)" fill="' + col + '"/>';
  else                     shape = '<circle r="9.8" fill="' + col + '"/>' +
                                   '<circle r="7.2" fill="none" stroke="#FBFAF6" stroke-width="1"/>';
  return '<g class="pin' + (sel===k ? " on" : "") + '" data-pin="' + k +
    '" transform="translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')" role="button" ' +
    'tabindex="0" aria-label="' + esc(o.n) + '">' +
    '<circle class="halo" r="15"/>' + shape +
    '<text y="' + (o.k === "taste" ? "5.4" : "3.3") + '" text-anchor="middle">' + o.num + '</text></g>';
}

/* ============================================================
   Map gestures — drag to pan, pinch or wheel to zoom
   ============================================================ */
function bindMapGestures(host){
  const pts = new Map();
  let last = null, pinch = null, raf = 0;
  const redraw = () => { if(raf) return;
    raf = requestAnimationFrame(() => { raf = 0; drawMap(); paintMe(); }); };

  host.addEventListener("pointerdown", e => {
    if(e.target.closest("[data-zoom],[data-fullmap],[data-pin],.attrib")) return;
    host.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size === 1) last = {x:e.clientX, y:e.clientY};
    if(pts.size === 2){
      const [a,b] = [...pts.values()];
      pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), z: mapView.z};
    }
  });

  host.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId) || !mapView) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const r = host.getBoundingClientRect();
    if(pts.size === 2 && pinch){
      const [a,b] = [...pts.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if(d > 8){
        followMe = false;
        zoomAt(pinch.z + Math.log2(d/pinch.d),
               (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top, host);
        redraw();
      }
      return;
    }
    if(pts.size === 1 && last){
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      if(Math.abs(dx) + Math.abs(dy) < 1) return;
      last = {x:e.clientX, y:e.clientY};
      followMe = false;
      const c = worldPx(mapView.lat, mapView.lon, mapView.z);
      const q = pxToLL(c.x - dx, c.y - dy, mapView.z);
      mapView.lat = clamp(q.lat, -85, 85); mapView.lon = q.lon;
      redraw();
    }
  });

  const end = e => { pts.delete(e.pointerId);
    if(pts.size < 2) pinch = null;
    if(pts.size === 0) last = null; else last = [...pts.values()][0]; };
  host.addEventListener("pointerup", end);
  host.addEventListener("pointercancel", end);

  host.addEventListener("wheel", e => {
    if(!mapView) return;
    e.preventDefault();
    const r = host.getBoundingClientRect();
    followMe = false;
    zoomAt(mapView.z - Math.sign(e.deltaY)*0.5, e.clientX - r.left, e.clientY - r.top, host);
    redraw();
  }, {passive:false});
}

/* The box changes size on full screen, on rotation and on a window drag,
   and only some of those raise a window resize. Watch the box itself. */
function watchMapSize(host){
  if(typeof ResizeObserver !== "function") return;
  let last = "", raf = 0;
  new ResizeObserver(() => {
    if(raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const k = host.clientWidth + "x" + host.clientHeight;
      if(k === last || !host.clientWidth || !host.isConnected) return;
      last = k; drawMap(); paintMe();
    });
  }).observe(host);
}

/* ============================================================
   Full screen — the whole phone for the map. Native fullscreen
   where it exists, a fixed overlay where it does not.
   ============================================================ */
const FS_ICON = {
  in:  '<svg viewBox="0 0 20 20" aria-hidden="true">' +
       '<path d="M8 2H2v6M12 2h6v6M8 18H2v-6M12 18h6v-6"/></svg>',
  out: '<svg viewBox="0 0 20 20" aria-hidden="true">' +
       '<path d="M2 7h5V2M18 7h-5V2M2 13h5v5M18 13h-5v5"/></svg>'
};

function paintFullBtn(){
  const b = document.querySelector("[data-fullmap]"); if(!b) return;
  b.innerHTML = mapFull ? FS_ICON.out : FS_ICON.in;
  b.setAttribute("aria-label", mapFull ? "Leave full screen" : "Full screen map");
  b.setAttribute("aria-pressed", mapFull);
  b.title = mapFull ? "Leave full screen" : "Full screen map";
}

const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;

function enterMapFull(){
  const host = $("#viewbox"); if(!host || mode !== "map" || mapFull) return;
  mapFull = true;
  host.classList.add("fs");
  document.body.classList.add("fsmap");
  const req = host.requestFullscreen || host.webkitRequestFullscreen;
  if(req){ try{ Promise.resolve(req.call(host)).catch(() => {}); }catch(e){} }
  paintFullBtn();
  requestAnimationFrame(() => { drawMap(); paintMe(); });
}

function exitMapFull(){
  if(!mapFull) return;
  mapFull = false;
  const host = $("#viewbox");
  if(host) host.classList.remove("fs");
  document.body.classList.remove("fsmap");
  if(fsElement()){
    const off = document.exitFullscreen || document.webkitExitFullscreen;
    if(off){ try{ Promise.resolve(off.call(document)).catch(() => {}); }catch(e){} }
  }
  paintFullBtn();
  requestAnimationFrame(() => {
    if(tab === "chart" && mode === "map"){ drawMap(); paintMe(); }
  });
}

/* the browser can drop out of fullscreen on its own — Esc, a swipe, a navigation */
["fullscreenchange","webkitfullscreenchange"].forEach(ev =>
  document.addEventListener(ev, () => { if(!fsElement()) exitMapFull(); rehomeHail(); }));

/* Esc gets us out either way — the browser handles native fullscreen itself,
   the overlay has nobody else to do it */
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && mapFull) exitMapFull();
});

function zoomAt(z, sx, sy, host){
  const W = host.clientWidth, H = host.clientHeight;
  const c0 = worldPx(mapView.lat, mapView.lon, mapView.z);
  const anchor = pxToLL(c0.x - W/2 + sx, c0.y - H/2 + sy, mapView.z);
  mapView.z = clamp(z, MINZ, MAXZ);
  const a = worldPx(anchor.lat, anchor.lon, mapView.z);
  const c = pxToLL(a.x + (W/2 - sx), a.y + (H/2 - sy), mapView.z);
  mapView.lat = clamp(c.lat, -85, 85); mapView.lon = c.lon;
}

/* ============================================================
   GPX — hand the whole port to any map app, offline
   ============================================================ */
function gpxFor(p){
  const x = s => String(s==null?"":s).replace(/[&<>'"]/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&apos;",'"':"&quot;"}[c]));
  const wpts = plotted(p).map(o => {
    const L = ll(o.c);
    return '  <wpt lat="' + L.lat + '" lon="' + L.lon + '">\n' +
      '    <name>' + x(KIND[o.k].t.toUpperCase().slice(0,1) + o.num + " " + o.n) + '</name>\n' +
      '    <desc>' + x((o.sub ? o.sub + " — " : "") + (o.d||"") +
                      (o.q ? " Where to find it: " + o.q : "")) + '</desc>\n' +
      '    <type>' + o.k + '</type>\n  </wpt>';
  }).join("\n");
  const rte = '  <rte>\n    <name>' + x(p.name + " — walking order") + '</name>\n' +
    p.stops.filter(s => ll(s.c)).map(s => { const L = ll(s.c);
      return '    <rtept lat="' + L.lat + '" lon="' + L.lon + '"><name>' + x(s.n) + '</name></rtept>';
    }).join("\n") + '\n  </rte>';
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<gpx version="1.1" creator="Shore Book · Hong Kong to Singapore" ' +
    'xmlns="http://www.topografix.com/GPX/1/1">\n' +
    '  <metadata><name>' + x("Shore Book — " + p.name) + '</name></metadata>\n' +
    wpts + '\n' + rte + '\n</gpx>\n';
}

function download(name, text, mime){
  try{
    const url = URL.createObjectURL(new Blob([text], {type:mime}));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }catch(e){
    window.open("data:" + mime + ";charset=utf-8," + encodeURIComponent(text), "_blank");
  }
}

/* ============================================================
   RENDER — panel
   ============================================================ */
function renderPanel(){
  const p = port();
  if(tab === "walk")        $("#panel").innerHTML = renderWalk();
  else if(tab === "eat")    $("#panel").innerHTML = renderCards("eat");
  else if(tab === "taste")  $("#panel").innerHTML = renderTaste();
  else if(tab === "buy")    $("#panel").innerHTML = renderBuy();
  else if(tab === "screen") $("#panel").innerHTML = renderCards("screen",
    "What was filmed here, and what only pretends to have been. Everything below is a real location you can stand on unless the card says otherwise. " +
    "Each card tells you where to find the scene — season and episode where there is one, otherwise roughly where in the running time to scrub. " +
    "Clock times are approximate, and where nothing honest can be cited the card says so.");
  else if(tab === "chart"){ $("#panel").innerHTML = chartShell(); drawView(); }
  else $("#panel").innerHTML = '<ul class="know">' +
    p.know.map(k => "<li>" + esc(k) + "</li>").join("") + "</ul>";
}

function renderAll(){
  renderPortRail(); renderHead(); renderTide(); renderPanel();
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", t.dataset.tab === tab));
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e => {
  unlockAudio();   /* iOS wakes the audio clock for a finger and nothing else */

  const pb = e.target.closest("[data-port]");
  if(pb){ exitMapFull(); cur = pb.dataset.port; sel = null; mapView = null; followMe = false;
    buzz.near = {}; clearHail();      /* pin keys repeat from port to port */
    store.set("sbhk.port", cur); renderAll(); window.scrollTo(0,0); return; }

  const tb = e.target.closest(".tab");
  if(tb){ exitMapFull(); tab = tb.dataset.tab; renderAll(); return; }

  const md = e.target.closest("[data-setmode]");
  if(md){ if(md.dataset.setmode === mode) return;
    exitMapFull();
    mode = md.dataset.setmode; store.set("sbhk.mode", mode);
    renderPanel(); return; }

  const lay = e.target.closest("[data-layer]");
  if(lay){ const k = lay.dataset.layer; layers[k] = !layers[k];
    if(sel && sel.split(":")[0] === k && !layers[k]) sel = null;
    renderPanel(); return; }

  const fit = e.target.closest("[data-fit]");
  if(fit){ fitAll = !fitAll; renderPanel(); return; }

  const fp = e.target.closest("[data-fitport]");
  if(fp){ fitPort(); drawMap(); paintMe(); paintLocBar(); return; }

  const fs = e.target.closest("[data-fullmap]");
  if(fs){ mapFull ? exitMapFull() : enterMapFull(); return; }

  const zm = e.target.closest("[data-zoom]");
  if(zm){ const host = $("#viewbox");
    if(host && mapView){ followMe = false;
      zoomAt(mapView.z + (+zm.dataset.zoom), host.clientWidth/2, host.clientHeight/2, host);
      drawMap(); paintMe(); }
    return; }

  const gb = e.target.closest("[data-geo]");
  if(gb){ const what = gb.dataset.geo;
    if(what === "on") startGeo();
    else if(what === "off") stopGeo();
    else if(what === "follow"){ followMe = !followMe;
      if(followMe && geo.fix){ mapView.z = Math.max(mapView.z, 17);
        centreOn(geo.fix.lat, geo.fix.lon); }
      paintLocBar(); }
    return; }

  const bz = e.target.closest("[data-buzz]");
  if(bz){
    buzz.on = !buzz.on; store.set("sbhk.buzz", buzz.on ? "1" : "0");
    if(buzz.on){ buzz.near = {}; buzz.last = 0; unlockAudio();
      if(!checkProximity()){ fire([40]); tapSwitch([40]); } }
    else { clearTimeout(buzz.retry); buzz.retry = 0; clearHail(); }
    paintLocBar(); return;
  }

  const sd = e.target.closest("[data-sound]");
  if(sd){
    sound.on = !sound.on; store.set("sbhk.sound", sound.on ? "1" : "0");
    if(sound.on){ unlockAudio(); chime("walk"); }   /* a note, so you know the volume */
    paintLocBar(); return;
  }

  const bt = e.target.closest("[data-bztest]");
  if(bt){ if(BUZZ[bt.dataset.bztest]) signal(bt.dataset.bztest); return; }

  const hx = e.target.closest("[data-hailx]");
  if(hx){ clearHail(); return; }

  const gp = e.target.closest("[data-gpx]");
  if(gp){ const p = port();
    download("shore-book-" + p.id + ".gpx", gpxFor(p), "application/gpx+xml"); return; }

  const pin = e.target.closest("[data-pin]");
  if(pin){ selectPin(pin.dataset.pin, false);
    const c = sel && $("#card-" + CSS.escape(sel));
    if(c) c.scrollIntoView({block:"nearest", behavior:"smooth"});
    return; }

  const go = e.target.closest("[data-goto]");
  if(go){ const k = go.dataset.goto; clearHail();
    if(tab === "chart"){ selectPin(k, true); }
    else { sel = k; tab = "chart"; renderAll();
      if(mode === "map") selectPin(k, true);
      window.scrollTo({top:0, behavior:"smooth"}); }
    return; }

  const chk = e.target.closest("[data-check]");
  if(chk){
    const i = +chk.dataset.check, d = getDone();
    const k = d.indexOf(i); k > -1 ? d.splice(k,1) : d.push(i);
    setDone(d); renderPanel(); return;
  }

  const op = e.target.closest("[data-open]");
  if(op){ op.parentElement.classList.toggle("open"); return; }
});

/* pins are SVG groups — give them a keyboard */
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const pin = e.target.closest && e.target.closest("g[data-pin]");
  if(!pin) return;
  e.preventDefault();
  selectPin(pin.dataset.pin, false);
});

/* the map is sized in CSS pixels, so it has to be redrawn when they change */
let rz = 0;
window.addEventListener("resize", () => {
  if(tab !== "chart" || mode !== "map") return;
  clearTimeout(rz); rz = setTimeout(() => { drawMap(); paintMe(); }, 150);
});

$("#ashore").addEventListener("change", e => {
  setShipTime(cur, "ashore", e.target.value, port().ashore); renderTide(); renderPanel(); });
$("#allAboard").addEventListener("change", e => {
  setShipTime(cur, "aboard", e.target.value, port().aboard); renderTide(); renderPanel(); });
$("#reset").addEventListener("click", () => { setDone([]); renderPanel(); });

const d = new Date();
$("#today").textContent = d.toLocaleDateString("en-GB",
  {weekday:"short", day:"numeric", month:"short"});

renderAll();
setInterval(() => { renderTide(); if(tab==="walk") renderPanel(); }, 60000);

/* If location was on last time the permission is already granted — resume quietly. */
if(store.get("sbhk.geo") === "1") startGeo();

/* Offline: cache the app on first load so it runs with no signal. */
if("serviceWorker" in navigator){
  /* Cache-first means an old copy of the book can sit on a phone indefinitely.
     Ask for a new one on every launch, and again hourly if the app is left
     open, so a corrected sailing time reaches the person holding it. */
  const hadWorker = !!navigator.serviceWorker.controller;
  let swapping = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(!hadWorker || swapping) return;   /* first install: nothing to replace */
    swapping = true;
    location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 3600000);
    }).catch(() => {});
  });
}
